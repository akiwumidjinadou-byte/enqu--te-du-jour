<style>
:root{--bg:#dde5ea;--card:#fbfaf4;--ink:#1c2733;--mute:#5d6b78;--tape:#e8c547;--red:#b3302a;--ok:#2a6a45;--line:#c5cfd6;--btn:#1c2733;--btnink:#fbfaf4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121c28;--card:#1d2938;--ink:#ece6d3;--mute:#9fb0bf;--tape:#e8c547;--red:#e0675f;--ok:#6cc08c;--line:#31404f;--btn:#e8c547;--btnink:#1c2733;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121c28;--card:#1d2938;--ink:#ece6d3;--mute:#9fb0bf;--tape:#e8c547;--red:#e0675f;--ok:#6cc08c;--line:#31404f;--btn:#e8c547;--btnink:#1c2733;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.tape{height:10px;margin:10px 0 18px;background:repeating-linear-gradient(-45deg,var(--tape) 0 12px,var(--ink) 12px 24px);border-radius:2px}
h1{font-size:30px;line-height:1.15}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0}
.intro{font-family:Georgia,serif;font-size:17px;line-height:1.55}
.count{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;font-weight:600;display:flex;justify-content:space-between}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px;border:2px solid var(--ink)}
.dots span.on{background:var(--ink)}
h2{font-size:20px}.role{color:var(--mute);font-size:14px;margin-bottom:8px}
.q{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.q:disabled{opacity:.35;cursor:default}
.q:focus-visible,.btn:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.a{margin:8px 0;padding:8px 10px;border-left:4px solid var(--tape)}
.a small{display:block;color:var(--mute)}
.btn{padding:12px 16px;border-radius:6px;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.stamp{display:inline-block;transform:rotate(-6deg);border:4px solid;padding:4px 14px;font:700 24px Georgia,serif;margin:6px 0 12px}
.stamp.w{color:var(--ok)}.stamp.l{color:var(--red)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:6px;font:inherit;margin:8px 0}
.hint{color:var(--mute);font-size:14px}
.hero{width:100%;height:auto;display:block;margin:0 0 14px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 17px Georgia,serif;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pic{position:relative;overflow:hidden;border-radius:8px}
.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero svg{display:block;width:100%;height:auto}
.av{width:68px;height:68px;border-radius:50%;box-shadow:0 0 0 3px var(--line)}
.av svg{width:100%;height:100%;display:block}

/* ===== Mini-jeux : labyrinthes (ajout) ===== */
#mazes{max-width:560px;margin:0 auto;padding:0 16px 96px}
.mz-title{font-size:24px;line-height:1.2;margin:4px 0 6px}
.mz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mz-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border:1px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.mz-tile .mz-fl{font-size:30px;line-height:1.15}
.mz-tile b{font-size:14px}.mz-tile small{color:var(--mute);font-size:12px;letter-spacing:1px}
.mz-tile i{position:absolute;top:4px;right:6px;font-style:normal;font-size:13px}
.mz-tile:focus-visible,.mz-pad button:focus-visible,.mz-fab:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.mz-hud{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px;margin:10px 0 8px;min-height:24px}
.mz-cvw{display:flex;justify-content:center}
.mz-cvw canvas{touch-action:none;-webkit-user-select:none;user-select:none;border:2px solid var(--ink);border-radius:8px;max-width:100%}
.mz-pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center;margin:14px 0 8px}
.mz-pad button{font:inherit;font-size:22px;border:1px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.mz-pad button:active{background:var(--tape);color:#1c2733}
.mz-pad .u{grid-column:2;grid-row:1}.mz-pad .l{grid-column:1;grid-row:2}.mz-pad .d{grid-column:2;grid-row:2}.mz-pad .r{grid-column:3;grid-row:2}
.mz-st{font-size:26px;margin:4px 0}.mz-cfw{position:absolute;inset:0;overflow:hidden;pointer-events:none}.mz-cf{position:absolute;top:-8%;font-size:22px;animation:mzf 1.9s ease-in forwards}@keyframes mzf{to{transform:translateY(420px) rotate(360deg);opacity:0}}
.mz-fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;padding:10px 14px;border-radius:999px;border:0;background:var(--btn);color:var(--btnink);font:inherit;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
#extras,#memo,#expert{max-width:560px;margin:0 auto;padding:0 16px 20px}
.mm-grid{display:grid;gap:8px;margin:12px 0}.mm-card{aspect-ratio:1;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:30px;cursor:pointer;padding:0}
.mm-card.up,.mm-card.ok{background:var(--tape);color:#1c2733}.mm-card.ok{opacity:.65}
</style>

<script>
var Q=["Où étiez-vous à l’heure du crime ?","Quel lien aviez-vous avec la victime ?","Avez-vous vu ou entendu quelque chose ?","Qui soupçonnez-vous ?"];
var CASES=[
{t:"Le crime du manoir Valmont",i:"Lord Valmont a été retrouvé mort dans sa bibliothèque, vers 22 h 15. Il devait modifier son testament le lendemain. Trois personnes se trouvaient dans la maison. Une seule ment.",c:0,
s:[{n:"Hélène Valmont",r:"nièce de la victime",a:["Au salon, au piano, jusqu’à 22 h 30 passées. Le docteur m’a écoutée tout ce temps.","C’est mon oncle qui m’a élevée. J’ignorais tout de ce testament.","Rien. J’étais absorbée par ma musique.","Gaspard rôdait souvent dans les couloirs, le soir."]},
{n:"Gaspard Lenoir",r:"majordome",a:["À l’office, à ranger l’argenterie. J’ai entendu le piano s’arrêter vers 22 h 10.","Trente ans de service. Nous nous sommes disputés au sujet de mon salaire, rien de grave.","J’ai croisé Mademoiselle Hélène près de l’escalier de la bibliothèque, très pâle, vers 22 h 15.","Le docteur semblait nerveux ce soir."]},
{n:"Dr Rosen",r:"médecin de famille",a:["Au salon avec Hélène. Je n’ai quitté la pièce qu’à 22 h 30, quand on a crié.","Je soigne Lord Valmont depuis dix ans. Il m’a prêté de l’argent, que je n’ai pas rendu.","Le piano s’est tu vers 22 h 10. Hélène est sortie « prendre l’air ».","Je ne veux accuser personne sans preuve."]}],
x:"Hélène affirme avoir joué jusqu’à 22 h 30, mais le docteur et le majordome situent l’arrêt du piano vers 22 h 10. Elle a été vue près de la bibliothèque à 22 h 15."},
{t:"Le diamant de l’hôtel Belvédère",i:"« L’Étoile du Nord », un diamant exposé dans le coffre de l’hôtel, a disparu vers 21 h. Le coffre n’a pas été forcé : quelqu’un avait la clé. Trois suspects, un menteur.",c:1,
s:[{n:"Mme Castel",r:"cliente de la suite 12",a:["Dans ma suite. J’ai appelé la réception à 21 h pour un oreiller : personne n’a décroché.","Je viens ici chaque hiver. Je connais le diamant, je l’ai toujours admiré.","J’ai entendu des pas rapides vers l’ascenseur de service.","Le concierge est bien pressé, ce soir."]},
{n:"Marc Dubreuil",r:"concierge",a:["À mon poste, à la réception, toute la soirée. Mon registre le prouve.","Dix ans à l’hôtel. Je suis le gardien de la clé du coffre.","Rien d’anormal. Une soirée calme.","Peut-être la femme de chambre : elle a accès à tous les étages."]},
{n:"Inès Moreau",r:"femme de chambre",a:["À l’étage, à préparer les suites. Je suis passée à la réception à 21 h 05 : le comptoir était vide.","Je travaille ici depuis deux ans. Je n’ai jamais touché au coffre.","Le concierge est revenu de l’arrière-salle en rajustant sa veste, juste après 21 h.","Je préfère ne pas dire de noms."]}],
x:"Marc prétend n’avoir pas quitté la réception, mais Mme Castel n’a eu aucune réponse à 21 h et Inès a trouvé le comptoir vide. Il détenait la clé du coffre."},
{t:"Le manuscrit de la librairie Orphée",i:"Un manuscrit du XVIIe siècle a disparu de la librairie entre 17 h et 18 h. La vitrine était fermée à clé. Trois personnes sont passées. Une seule ment.",c:2,
s:[{n:"Théo Barral",r:"stagiaire",a:["Au comptoir toute l’après-midi. J’ai fermé la boutique à 18 h.","Je suis stagiaire depuis septembre. Monsieur Orphée me fait confiance.","À 17 h 45, Mme Prat sortait de l’arrière-boutique avec un grand sac.","Je n’ose pas accuser une cliente fidèle."]},
{n:"Olivier Orphée",r:"libraire",a:["Chez le notaire de 16 h 30 à 18 h 30. J’ai laissé Théo seul avec Mme Prat vers 17 h 30.","C’est ma boutique depuis vingt ans. Ce manuscrit était mon plus bel exemplaire.","Au retour, la vitrine était intacte mais vide.","Il me manque des factures en retard, mais je ne soupçonne pas Théo."]},
{n:"Mme Prat",r:"collectionneuse",a:["Je ne suis passée qu’à 18 h 30. C’était déjà fermé, j’ai rebroussé chemin.","Cliente depuis des années. J’ai toujours rêvé de ce manuscrit.","Rien. Je n’étais pas là.","Le stagiaire est bien jeune pour surveiller un tel trésor."]}],
x:"Mme Prat affirme n’être venue qu’à 18 h 30 après la fermeture, mais Olivier l’a laissée dans la boutique à 17 h 30 et Théo l’a vue sortir de l’arrière-boutique à 17 h 45 avec un grand sac."},
{t:"Sabotage au théâtre du Lys",i:"Armand Roux, vedette de la pièce, a été assommé dans sa loge vers 20 h, avant le lever de rideau. Trois personnes étaient en coulisses.",c:0,s:[{n:"Clara Vidal",r:"actrice",a:["Seule en salle de maquillage jusqu’à 20 h 30, à répéter mon texte.","Il m’a pris le rôle principal, mais nous restons collègues.","Rien, j’étais concentrée.","Le régisseur a les clés de toutes les loges."]},{n:"Vincent Aubry",r:"régisseur",a:["En coulisses, à régler les lumières.","Dix ans de métier avec lui. Il était dur, je l’aimais bien.","À 20 h, j’ai croisé Clara dans le couloir des loges.","Le metteur en scène était furieux contre Armand."]},{n:"Pierre Delmas",r:"metteur en scène",a:["Dans la salle, à vérifier les places.","Il menaçait de partir avant la première. Nous nous sommes disputés.","À 20 h, la salle de maquillage était vide.","Quelqu’un qui voulait son rôle."]}],x:"Clara dit avoir été en maquillage jusqu’à 20 h 30, mais la salle était vide à 20 h et Vincent l’a croisée près des loges."},
{t:"Le dernier café du critique",i:"Le critique Maurice Fabre s’est effondré après le dessert : son café était empoisonné. Trois personnes l’ont approché ce soir-là.",c:2,s:[{n:"Chef Antoine",r:"chef de cuisine",a:["En cuisine, au coup de feu, toute la soirée.","Sa critique m’a coûté une étoile, mais j’ai tourné la page.","J’ai vu le sommelier remplir une tasse à l’office.","La serveuse était nerveuse."]},{n:"Julie Marchand",r:"serveuse",a:["En salle. J’ai servi le dessert, pas le café.","Je le servais depuis des années. Il laissait de bons pourboires.","Bastien a pris le plateau de café en disant que c’était un honneur.","Je n’accuse personne."]},{n:"Bastien Roy",r:"sommelier",a:["En cave, puis en salle. Je ne sers que le vin, je n’ai pas approché le café.","Il m’avait humilié devant des clients, mais c’est du passé.","Rien. Ce n’est pas mon service.","Le chef avait des raisons de lui en vouloir."]}],x:"Bastien dit ne pas avoir approché le café, mais le chef l’a vu remplir une tasse et Julie l’a vu prendre le plateau."},
{t:"La fuite des sujets d’examen",i:"Les sujets du partiel de droit ont circulé la veille de l’épreuve. Ils étaient dans un coffre dont trois personnes connaissaient le code.",c:1,s:[{n:"Pr Morel",r:"enseignant",a:["Chez moi, à corriger des copies.","Je n’ai jamais eu de problème avec mes étudiants.","Karim m’a demandé le code du coffre la veille, « pour ranger des documents ».","Je ne vois personne."]},{n:"Karim Saïdi",r:"assistant",a:["J’ai quitté le bureau à 17 h, comme chaque jour.","Je prépare ma thèse avec le professeur. Je lui dois beaucoup.","Rien d’inhabituel.","Mme Lopez avait accès aux clés."]},{n:"Mme Lopez",r:"secrétaire",a:["À mon poste jusqu’à 18 h 30.","Vingt ans au département. Je suis très discrète.","Karim m’a demandé la clé du bureau à 17 h 50 et la photocopieuse a tourné à 18 h.","Je ne fais confiance à personne, sauf au professeur."]}],x:"Karim dit avoir quitté le bureau à 17 h, mais il a demandé la clé à 17 h 50 et la photocopieuse a fonctionné à 18 h. Il connaissait le code."},
{t:"Le rosier arraché",i:"Le rosier primé de la fête des jardins a été arraché à l’aube. Trois voisins avaient une raison de passer par là.",c:0,s:[{n:"Mme Fournier",r:"rivale au concours",a:["À la fête du village, toute la matinée, avec mes confitures.","Nous concourons depuis dix ans. Son rosier gagne toujours.","Rien, je n’étais pas là.","M. Bernard se plaint de ce rosier depuis des mois."]},{n:"M. Bernard",r:"voisin",a:["Chez moi, à prendre mon café.","Ses racines abîment mon mur, je l’ai dit.","J’ai ramassé un sécateur marqué « Fournier » dans l’allée à 7 h.","Léo savait où était la clé du portail."]},{n:"Léo Cazes",r:"jardinier",a:["En route pour mon premier chantier de la journée.","Je taille ses haies depuis cinq ans.","À 7 h, la voiture de Mme Fournier était garée devant le portail.","Je ne dirais pas de mal d’un voisin."]}],x:"Mme Fournier dit avoir été à la fête, mais sa voiture était devant le portail à 7 h et son sécateur a été retrouvé dans l’allée."},
{t:"La valise échangée",i:"Une valise contenant des bijoux a été échangée dans le train de 14 h. Trois personnes avaient accès au compartiment.",c:2,s:[{n:"Mme Gaillard",r:"voyageuse",a:["Dans mon compartiment, voiture 3, tout le trajet.","Je transporte souvent des bijoux de famille.","Personne n’est venu contrôler les billets dans ma voiture à 14 h.","Le contrôleur est souvent dans les wagons de queue."]},{n:"M. Perrin",r:"voyageur",a:["Voiture 3, en face de Mme Gaillard.","Je ne la connaissais pas avant le trajet.","J’ai vu le contrôleur entrer dans le wagon à bagages avec un sac.","Je préfère ne pas accuser sans preuve."]},{n:"Bruno Faure",r:"contrôleur",a:["J’ai contrôlé les billets en voiture 3 à 14 h.","Quinze ans de métier, jamais un reproche.","Rien d’anormal sur le trajet.","M. Perrin était très nerveux."]}],x:"Bruno prétend avoir contrôlé la voiture 3 à 14 h, mais Mme Gaillard n’a vu personne passer et M. Perrin l’a vu avec un sac dans le wagon à bagages."},
{t:"Le master effacé",i:"L’enregistrement final d’un album a été effacé du serveur du studio. Trois personnes avaient accès à la régie ce soir-là.",c:1,s:[{n:"Lola Mercier",r:"chanteuse",a:["En cabine, à enregistrer jusqu’à 20 h 30.","C’est mon album, je n’ai aucun intérêt à le perdre.","La lumière de la régie était encore allumée quand je suis partie.","Max est très stressé par les délais."]},{n:"Sam Perret",r:"ingénieur du son",a:["J’ai quitté le studio à 19 h.","Je mixe ses albums depuis trois ans, je suis fier de celui-ci.","Rien, j’étais déjà rentré.","Quelqu’un qui n’aime pas ce disque."]},{n:"Max Girard",r:"producteur",a:["Dans mon bureau, au téléphone avec le label.","Je finance cet album, je veux qu’il sorte.","Le badge du studio montre une sortie de Sam à 21 h.","Sam voulait être crédité comme coproducteur."]}],x:"Sam dit être parti à 19 h, mais Lola a vu la régie allumée à 20 h 30 et son badge indique une sortie à 21 h."},
{t:"La copie du musée",i:"Le tableau exposé au musée de Saint-Aubin est une copie. L’original a été remplacé sans qu’on s’en aperçoive.",c:2,s:[{n:"Mme Aubert",r:"conservatrice",a:["Au musée toute la semaine, comme toujours.","Je veille sur cette collection depuis quinze ans.","Paul a emprunté la toile en juin, pour un nettoyage.","Je ne soupçonne personne."]},{n:"Roger Blanc",r:"gardien de nuit",a:["À mon poste, de 20 h à 6 h.","Je connais chaque salle par cœur.","Un lundi soir, j’ai vu Paul sortir de l’atelier avec un grand étui.","Mme Aubert est trop honnête pour ça."]},{n:"Paul Lemoine",r:"restaurateur",a:["Je n’ai pas touché ce tableau depuis l’inventaire de mars.","Je travaille pour le musée depuis trois ans.","Rien d’inhabituel.","Le gardien a les clés de toutes les salles."]}],x:"Paul affirme ne pas avoir touché le tableau depuis mars, mais Mme Aubert l’a vu emprunter la toile en juin et Roger l’a vu sortir avec un grand étui."},
{t:"Le gâteau de mariage saboté",i:"La pièce montée du mariage a été écrasée juste avant les photos. Trois personnes avaient accès à la réserve.",c:0,s:[{n:"Hugo Lambert",r:"témoin du marié",a:["Au bar avec les invités.","Meilleur ami du marié, je n’ai rien contre le couple.","Rien d’anormal.","La belle-mère n’aimait pas ce gâteau."]},{n:"Mme Roche",r:"belle-mère",a:["En salle, avec la mariée.","Mon gendre me plaît beaucoup, malgré nos différences.","Hugo avait de la crème sur sa manche pendant les photos.","Le traiteur a tout préparé trop vite."]},{n:"Sofia Keller",r:"traiteuse",a:["En cuisine, jusqu’aux photos.","Je ne connaissais pas ces mariés avant ce week-end.","Le gâteau est sorti à 15 h. Hugo est entré dans la réserve avec les clés.","Je ne me permettrais pas d’accuser un invité."]}],x:"Hugo dit être resté au bar, mais il est entré dans la réserve à 15 h et avait de la crème sur sa manche."},
{t:"Les échantillons contaminés",i:"Les échantillons d’une étude ont été contaminés dans la nuit. Trois personnes avaient un badge d’accès.",c:1,s:[{n:"Dr Imane Haddad",r:"directrice du laboratoire",a:["Chez moi, avec mes enfants.","Ce projet est mon plus gros contrat.","Lucas m’a écrit à 22 h qu’il vérifiait un congélateur.","Je n’accuse personne."]},{n:"Lucas Moreau",r:"technicien",a:["J’ai quitté le laboratoire à 19 h.","Je gère le matériel depuis deux ans.","Rien, j’étais parti.","Yanis restait souvent tard."]},{n:"Yanis Bakri",r:"doctorant",a:["À la bibliothèque jusqu’à 21 h 30, puis je suis repassé au laboratoire.","Je prépare ma thèse sur ces échantillons.","À 22 h, j’ai croisé Lucas dans le couloir, il disait vérifier un congélateur.","Lucas a eu un avertissement le mois dernier."]}],x:"Lucas dit être parti à 19 h, mais il a écrit à Imane à 22 h depuis le laboratoire et Yanis l’y a croisé."},
{t:"Le coffre du capitaine",i:"Pendant la croisière, le coffre du capitaine a été vidé à 3 h du matin. Trois personnes étaient éveillées.",c:2,s:[{n:"Lt Moreau",r:"officier de quart",a:["Sur la passerelle, à surveiller le radar.","Le capitaine est mon ami depuis vingt ans.","Rien, la nuit était calme.","Le cuisinier a la clé des réserves proches de la cabine."]},{n:"Mme Vasseur",r:"passagère",a:["Sur le pont, à prendre l’air.","Je suis invitée du capitaine pour la traversée.","Dario est passé à 3 h avec un chariot, près des cabines.","Le lieutenant est resté sur la passerelle, je l’ai vu."]},{n:"Dario Costa",r:"cuisinier",a:["Dans ma cuisine, à préparer la pâte du petit-déjeuner.","Je suis à bord depuis deux saisons.","Rien, personne n’est venu en cuisine cette nuit.","La passagère se promène beaucoup la nuit."]}],x:"Dario dit être resté en cuisine, mais Mme Vasseur l’a croisé à 3 h avec un chariot près des cabines."},
{t:"Le phare éteint",i:"La lumière du phare s’est éteinte à 23 h, et un bateau a frôlé les rochers. Trois personnes se trouvaient sur place. Une seule ment.",c:1,s:[{n:"Yann Le Goff",r:"gardien du phare",a:["En haut de la tour jusqu’à 22 h 30, puis ma ronde. À 22 h 45, j’ai aperçu la barque de Loïc au pied de l’escalier.","Je garde ce phare depuis douze ans.","Un moteur de barque vers 22 h 45, puis le noir complet à 23 h.","Loïc se plaint depuis des mois de cette lumière qui effraie les poissons."]},
{n:"Loïc Mahé",r:"pêcheur",a:["Au port, à réparer mes filets, de 21 h à minuit. Personne ne m’a quitté des yeux.","Voisin du phare depuis toujours. Nous nous croisons chaque matin.","Rien d’anormal, la mer était calme.","Peut-être la nouvelle ingénieure, elle touche à tout."]},
{n:"Dr Nora Salmon",r:"ingénieure",a:["Dans le local technique jusqu’à 22 h, puis dans ma chambre. Un moteur de barque m’a réveillée vers 22 h 45.","Je suis venue vérifier la nouvelle lampe.","Ce moteur, c’était celui de la barque de Loïc, je le reconnais entre mille.","Je préfère attendre des preuves."]}],x:"Loïc affirme n’avoir pas quitté le port, mais Yann a vu sa barque au pied du phare à 22 h 45 et Nora a reconnu son moteur au même moment."},
{t:"Le vélo du champion",i:"Le vélo de course de la favorite a disparu du garage avant le départ de 9 h. Trois personnes avaient accès à la place du village.",c:0,s:[{n:"Rémi Aubin",r:"mécanicien",a:["Au café de la place dès 7 h, pour mon petit-déjeuner.","Je règle ses vélos depuis cinq ans.","Rien vu. Le garage était fermé quand je suis passé.","Maëlle était très tendue avant la course."]},
{n:"Maëlle Dufour",r:"rivale",a:["À l’échauffement sur la piste, à partir de 7 h 15.","Nous courons dans la même catégorie. Une rivalité sportive, rien de plus.","À 7 h 30, j’ai vu Rémi sortir du garage avec un long sac sur l’épaule.","Je ne veux pas accuser sans preuve."]},
{n:"Pierre Vidal",r:"voisin",a:["Chez moi, devant mon café. De ma fenêtre, je vois toute la place.","Je connais la championne depuis son enfance.","Le café de la place n’a ouvert qu’à 8 h ce matin, à cause d’une panne.","Rémi avait l’air pressé en traversant la place."]}],x:"Rémi dit avoir pris son petit-déjeuner au café dès 7 h, mais le café n’a ouvert qu’à 8 h (Pierre) et Maëlle l’a vu sortir du garage à 7 h 30 avec un long sac."},
{t:"La recette volée",i:"Le carnet de recettes de la pâtisserie du Fournil d’Or a disparu pendant la nuit. Trois personnes avaient la clé du laboratoire.",c:2,s:[{n:"Léa Fontaine",r:"apprentie",a:["Arrivée à 6 h 45, le carnet n’était déjà plus là.","Je travaille ici depuis six mois, la patronne me fait confiance.","Le camion de Bruno est resté garé devant la boutique jusqu’à 6 h 30.","Je n’ose accuser personne."]},
{n:"Mme Garnier",r:"pâtissière rivale",a:["Chez moi, à préparer ma propre boutique.","Nous nous concurrençons depuis des années, mais poliment.","À 6 h 15, en passant, j’ai vu Bruno par la vitre du laboratoire, un carnet à la main.","Les livreurs ont tous une clé, c’est imprudent."]},
{n:"Bruno Petit",r:"livreur",a:["Livraison à 5 h, puis je suis reparti aussitôt sur ma tournée.","Dix ans que je livre le beurre et la farine.","Rien remarqué, il faisait encore nuit.","La rivale, peut-être. Elle rôde souvent par ici."]}],x:"Bruno prétend être reparti dès 5 h, mais son camion est resté devant la boutique jusqu’à 6 h 30 (Léa) et Mme Garnier l’a vu avec le carnet à 6 h 15."},
{t:"Le trophée du club de tennis",i:"Le trophée du tournoi a disparu de la vitrine du club entre 17 h et 18 h 30. Trois personnes étaient au club.",c:1,s:[{n:"Alice Morel",r:"présidente du club",a:["Dans mon bureau à préparer la remise des prix.","Je dirige le club depuis huit ans.","Le court 2 était fermé pour travaux tout l’après-midi, le filet était démonté.","Je ne soupçonne personne."]},
{n:"Karim Saïdi",r:"entraîneur",a:["Sur le court 2 avec un élève, de 17 h à 18 h 30.","Je forme les jeunes du club depuis cinq ans.","Rien vu, j’étais concentré sur l’entraînement.","Zoé traîne souvent près de la vitrine."]},
{n:"Zoé Perrin",r:"joueuse",a:["Au vestiaire, puis à la buvette jusqu’à 18 h.","C’est mon club depuis l’enfance.","J’ai croisé Karim près de la vitrine à 17 h 40, il tenait la clé.","Je ne veux pas accuser sans preuve."]}],x:"Karim dit avoir entraîné un élève sur le court 2, mais ce court était fermé pour travaux (Alice) et Zoé l’a vu près de la vitrine avec la clé à 17 h 40."},
{t:"Le colis disparu",i:"Un colis recommandé a disparu du bureau de poste vers 10 h. La porte de l’arrière-salle n’a pas été forcée.",c:0,s:[{n:"Gilles Maurin",r:"facteur",a:["En tournée de 8 h à 12 h, je ne suis pas repassé au bureau.","Quinze ans de métier, jamais un incident.","Rien vu, j’étais sur la route.","Les clients tournent souvent près du comptoir."]},
{n:"Rita Costa",r:"guichetière",a:["Au guichet toute la matinée.","Je travaille ici depuis trois ans.","Gilles est revenu au bureau à 10 h chercher son téléphone, je l’ai vu près du tri.","Je préfère ne rien dire de plus."]},
{n:"Mme Lenoir",r:"cliente",a:["Au bureau de 10 h à 10 h 15, pour envoyer une lettre.","Je viens chaque semaine.","À 10 h 05, j’ai croisé Gilles sortant de l’arrière-salle avec un petit carton.","Rita avait l’air gênée."]}],x:"Gilles affirme n’être pas repassé au bureau, mais Rita l’a vu près du tri à 10 h et Mme Lenoir l’a croisé à 10 h 05 sortant de l’arrière-salle avec un carton."},
{t:"Le serveur du lycée piraté",i:"Les notes du lycée ont été modifiées depuis la salle serveur à 14 h. La porte n’a pas été forcée.",c:2,s:[{n:"Pr Aubry",r:"enseignant",a:["Devant ma classe de 13 h 30 à 15 h.","Je suis dans cet établissement depuis vingt ans.","M. Faure m’a ouvert la salle serveur à 14 h en personne, pour récupérer un cours.","Je préfère ne pas accuser."]},
{n:"Salomé Girard",r:"déléguée des élèves",a:["Au CDI, à réviser avec des amis.","Je suis déléguée depuis la seconde.","À 14 h 10, j’ai vu M. Faure devant l’écran de la salle serveur.","Je ne veux pas accuser sans preuve."]},
{n:"M. Faure",r:"technicien",a:["En congé aujourd’hui, chez moi toute la journée.","Je m’occupe du réseau du lycée depuis dix ans.","Rien, puisque je n’étais pas là.","Les élèves connaissent parfois les mots de passe."]}],x:"M. Faure assure être resté en congé chez lui, mais Pr Aubry affirme qu’il lui a ouvert la salle serveur à 14 h et Salomé l’a vu devant l’écran à 14 h 10."},
{t:"La cloche du village",i:"La cloche de l’église a disparu dans la nuit, vers 3 h. Trois habitants pouvaient avoir vu quelque chose.",c:2,s:[{n:"M. Dumas",r:"maire",a:["Chez moi, endormi, jusqu’au matin.","Je suis maire depuis dix ans.","Vers 3 h, j’ai entendu un gros camion de ferraille sur la place. Seul Bastien en possède un.","Il faut attendre l’enquête."]},
{n:"Anaïs Roux",r:"institutrice",a:["Chez moi, à corriger des cahiers jusque tard.","Les enfants adorent cette cloche.","À 3 h 10, par ma fenêtre, j’ai vu le camion de Bastien devant l’église.","Je ne veux pas accuser sans preuve."]},
{n:"Bastien Roy",r:"ferrailleur",a:["Chez moi, endormi. Mon camion était au garage.","Je rachète du métal dans tout le canton.","Rien entendu de la nuit.","Le maire veut toujours faire changer la cloche."]}],x:"Bastien dit que son camion est resté au garage, mais le maire a entendu un camion de ferraille vers 3 h et Anaïs a vu le sien devant l’église à 3 h 10."},
{t:"Le costume du carnaval",i:"Le costume du roi du carnaval a disparu de l’atelier à 14 h, juste avant le défilé.",c:2,s:[{n:"Camille Bessy",r:"couturière",a:["Dans l’atelier jusqu’à 14 h, puis chez le teinturier.","J’ai cousu ce costume pendant trois mois.","À 14 h 10, j’ai vu Rose repartir de l’atelier avec une housse.","Je ne veux pas accuser sans preuve."]},
{n:"Gaston Thiry",r:"chef de char",a:["Sur la place, à préparer le char.","Je suis chef de char depuis dix ans.","Rose m’a demandé la clé de l’atelier à 14 h.","Elle voulait gagner le concours, c’est connu."]},
{n:"Rose Marchand",r:"rivale",a:["Au défilé, devant l’estrade avec mes amis, depuis le début de l’après-midi.","Je n’ai jamais mis les pieds dans cet atelier.","Rien vu, j’étais avec mes amis.","Gaston est jaloux de tout le monde."]}],x:"Rose affirme n’avoir jamais mis les pieds à l’atelier, mais Gaston lui a donné la clé à 14 h et Camille l’a vue en repartir avec une housse à 14 h 10."},
{t:"Le violon de la salle de concert",i:"Un violon de collection a disparu de sa loge à 20 h 55, juste avant le concert.",c:1,s:[{n:"Sofia Marin",r:"violoniste",a:["En loge, à m’accorder jusqu’à 20 h 45.","Ce violon appartient à l’orchestre depuis trente ans.","À 20 h 50, le bureau du chef était vide : j’ai frappé, personne.","Je préfère ne rien dire de plus."]},
{n:"Édgar Roche",r:"chef d’orchestre",a:["Dans mon bureau avec le trésorier jusqu’à 21 h.","Je dirige cet orchestre depuis quinze ans.","Rien d’anormal avant le concert.","Le régisseur a toutes les clés."]},
{n:"Hector Blanc",r:"régisseur",a:["Aux coulisses, à régler les lumières.","Je veille sur la salle depuis vingt ans.","À 20 h 55, j’ai vu Édgar courir dans le couloir vers la loge.","Je n’aime pas accuser un chef."]}],x:"Édgar dit avoir été dans son bureau avec le trésorier jusqu’à 21 h, mais Sofia l’a trouvé vide à 20 h 50 et Hector l’a vu courir vers la loge à 20 h 55."},
{t:"Le pique-nique saccagé",i:"Les paniers du pique-nique de la fête de famille ont été renversés dans la clairière vers 11 h 20.",c:0,s:[{n:"Léo Garnier",r:"cousin",a:["À la pêche à l’étang toute la matinée avec mon oncle.","Je vois la famille deux fois par an.","Rien vu, j’étais au bord de l’eau.","Julie était bizarre ce matin."]},
{n:"Oncle Marcel",r:"pêcheur du dimanche",a:["À l’étang, mais Léo m’a laissé seul entre 11 h et midi, pour « aller chercher des appâts ».","Je pêche ici depuis trente ans.","Les appâts, il ne les avait pas rapportés.","Je ne soupçonne pas ma famille."]},
{n:"Julie Brun",r:"voisine invitée",a:["Sur la nappe, à préparer les assiettes.","Je suis invitée chaque année.","À 11 h 20, j’ai vu Léo près des paniers, dans la clairière.","Je ne veux pas accuser sans preuve."]}],x:"Léo dit avoir pêché toute la matinée avec son oncle, mais Marcel l’a vu partir à 11 h pour des appâts jamais rapportés et Julie l’a vu près des paniers à 11 h 20."}
,{t:"La lentille du phare de Port-Brume",i:"La lentille du phare de Port-Brume a disparu entre 23 h et minuit. La porte de la tour était verrouillée de l’intérieur. Trois personnes avaient accès au site. Une seule ment.",c:2,
s:[{n:"Octave Garnier",r:"gardien du phare",a:["Dans ma cabine au pied de la tour, à dormir. La sirène de brume m’a réveillé à minuit.","Vingt ans que je veille sur ce phare. C’est toute ma vie.","La lumière de la tour s’est éteinte vers 23 h 20. J’ai senti une odeur de poisson dans l’escalier.","La pêche ne rapporte plus, tout le monde le sait au port."]},
{n:"Salomé Argon",r:"ingénieure du balisage",a:["Je vérifiais le balisage au bout de la jetée, de 22 h 30 à 23 h 30. J’ai vu le bateau de Yann amarré au quai à 23 h.","Je suis payée pour entretenir la lentille, pas pour la voler.","La lumière de la tour s’est éteinte vers 23 h 20, puis j’ai entendu une porte claquer.","Je ne veux accuser personne sans preuve."]},
{n:"Yann Le Goff",r:"pêcheur",a:["En mer, sur mon bateau, jusqu’à minuit passé. Pas un seul retour au port.","Le gardien m’achète mon poisson depuis des années, rien de plus.","Le brouillard était épais, je n’ai rien vu à terre.","Salomé est montée dans la tour plus tôt, je crois."]}],
x:"Yann prétend être resté en mer, mais Salomé a vu son bateau amarré au quai à 23 h. Octave a senti une odeur de poisson dans l’escalier de la tour."}
,{t:"La coupe du club Fou-du-Roi",i:"La coupe du tournoi d’échecs du club Fou-du-Roi a disparu pendant la finale, vers 16 h. Trois personnes ont quitté leur place à un moment. Une seule ment.",c:2,
s:[{n:"Rita Pons",r:"arbitre du tournoi",a:["Dans la salle, devant l’échiquier de la finale, de 15 h 30 à 16 h 30. Je n’ai pas bougé.","J’arbitre ce tournoi depuis cinq ans.","Le président était dans la salle, puis il est sorti en hâte vers 16 h.","Basile n’a pas levé les yeux de la partie."]},
{n:"Basile Morel",r:"finaliste",a:["À l’échiquier, en pleine finale. On ne peut pas quitter la table.","Je joue ici depuis l’enfance. La coupe nous tient tous à cœur.","J’ai vu le président près de la vitrine de la coupe avant la fin de la partie.","Je suis trop concentré pour soupçonner qui que ce soit."]},
{n:"Adrien Lacour",r:"président du club",a:["Dans mon bureau, au fond du couloir, à finaliser les comptes. Je n’ai pas bougé de 15 h 45 à 16 h 30.","Je dirige le club depuis dix ans. La coupe est notre fierté.","Rien entendu. Mon bureau est fermé à clé.","L’arbitre semblait agitée."]}],
x:"Adrien affirme être resté dans son bureau, mais Rita l’a vu sortir de la salle vers 16 h et Basile l’a aperçu près de la vitrine de la coupe."}
,{t:"La caisse du festival de Valmont",i:"Le soir du festival de Valmont, la caisse des recettes a disparu de la régie vers 22 h. Trois personnes avaient la clé. Une seule ment.",c:1,
s:[{n:"Lola Ferré",r:"organisatrice",a:["Au bar des artistes, de 21 h 30 à 22 h 15. Les musiciens peuvent en témoigner.","Je prépare ce festival depuis un an pour l’association.","À 22 h, la scène était vide : le dernier groupe n’était pas encore monté.","La caisse était sous ma responsabilité, je m’en veux."]},
{n:"Kévin Ndiaye",r:"régisseur",a:["Sur la scène, à régler les micros du dernier groupe, de 21 h 45 à 22 h 20.","Je suis régisseur ici depuis trois étés. J’ai la clé de la régie, comme les autres.","Un peu de bruit côté loges, rien d’inhabituel.","Maëlle quitte souvent son poste."]},
{n:"Maëlle Ortiz",r:"ingénieure du son",a:["À la table de mixage, face à la scène, jusqu’à 22 h 30. Je n’ai pas quitté mon poste.","Je mixe les concerts de la région. La caisse ne m’intéresse pas.","Depuis la table, je voyais toute la scène : personne n’y est monté entre 21 h 45 et 22 h 20. J’ai vu Kévin filer vers la régie avec un sac gris.","Je préfère ne pas accuser."]}],
x:"Kévin dit avoir réglé les micros sur scène, mais Lola l’a trouvée vide à 22 h et Maëlle, qui voyait toute la scène, ne l’y a jamais vu. Elle l’a vu filer vers la régie avec un sac."}
,{t:"Le coffre du marché de nuit",i:"Au marché de nuit de Port-Soleil, le coffre d’un stand de bijoux a été vidé vers 20 h 30. Trois commerçants se trouvaient près du stand. Une seule ment.",c:2,
s:[{n:"Anaïs Pelletier",r:"bijoutière",a:["À mon stand jusqu’à 20 h 20. Je suis allée chercher un café, et le coffre était vidé à mon retour, à 20 h 35.","Je vends ici depuis huit ans, tous les voisins me connaissent.","À 20 h 25, le stand de fleurs était fermé par un rideau. J’ai trouvé ça étrange.","Je ne veux accuser personne."]},
{n:"Idriss Benali",r:"cuisinier ambulant",a:["À mes fourneaux. Il y avait la queue, j’ai servi sans m’arrêter de 20 h à 21 h.","Anaïs m’achète toujours mes samoussas, nous nous entendons bien.","Zoé est passée devant mon stand vers 20 h 25, très pressée, un sac sous le bras.","Je ne soupçonne personne."]},
{n:"Zoé Marchand",r:"fleuriste",a:["À mon stand de fleurs, ouvert toute la soirée sans fermer une seule minute.","Je connais Anaïs depuis longtemps, nous sommes voisines de stand.","Rien vu. Il y avait trop de monde.","Idriss s’absente souvent de ses fourneaux."]}],
x:"Zoé affirme que son stand est resté ouvert, mais Anaïs l’a vu fermé par un rideau à 20 h 25 et Idriss l’a vue passer, pressée, avec un sac."}

 for(i=0;i<w*h;i++){g.push(0);seen.push(false)}
 seen[0]=true;

  var c=st[st.length-1],x=c%w,y=(c/w)|0,op=[];
  for(k=0;k<4;k++){var nx=x+DIR[k].x,ny=y+DIR[k].y;if(nx>=0&&ny>=0&&nx<w&&ny<h&&!seen[ny*w+nx])op.push(k)}
  if(!op.length){st.pop();continue}
  var d=DIR[op[(r()*op.length)|0]],n=(y+d.y)*w+x+d.x;
  g[c]|=d.b;g[n]|=d.o;seen[n]=true;st.push(n);
 }
 for(k=0;k<loops;k++){
  var X=(r()*w)|0,Y=(r()*h)|0,D=DIR[(r()*4)|0],NX=X+D.x,NY=Y+D.y;
  if(NX>=0&&NY>=0&&NX<w&&NY<h){g[Y*w+X]|=D.b;g[NY*w+NX]|=D.o}
 }

}
function bfs(g,w,h,s){

  var c=q[qi++],x=c%w,y=(c/w)|0;
  for(var k=0;k<4;k++)if(g[c]&DIR[k].b){var n=(y+DIR[k].y)*w+x+DIR[k].x;if(d[n]<0){d[n]=d[c]+1;q.push(n)}}
 }

}
function build(c,seed){

 for(i=0;i<w*h;i++)if(d[i]>d[ex])ex=i;
 var items=[];
 if(c.items){
  var cand=[];for(i=1;i<w*h;i++)if(i!==ex&&d[i]>=4)cand.push(i);
  for(i=cand.length-1;i>0;i--){var j=(r()*(i+1))|0,t=cand[i];cand[i]=cand[j];cand[j]=t}
  var gaps=[4,2,0];
  for(var gi=0;gi<gaps.length&&items.length<c.items.n;gi++){
   for(i=0;i<cand.length&&items.length<c.items.n;i++){
    var a=cand[i];if(items.indexOf(a)>-1)continue;
    var ok=true,pts=items.concat([0,ex]);
    for(var m=0;m<pts.length;m++){var dx=Math.abs(a%w-pts[m]%w),dy=Math.abs(((a/w)|0)-((pts[m]/w)|0));if(dx+dy<gaps[gi]){ok=false;break}}
    if(ok)items.push(a);
   }

 while(rest.length){var dd=bfs(g,w,h,cur),bi=0;for(i=1;i<rest.length;i++)if(dd[rest[i]]<dd[rest[bi]])bi=i;len+=dd[rest[bi]];cur=rest[bi];rest.splice(bi,1)}

 return{g:g,w:w,h:h,exit:ex,items:items,limit:c.timed?Math.round(len*1.5+30):0,len:len};
}

function reveal(){

  for(x=Math.max(0,Math.floor(px-r));x<=Math.min(w-1,Math.ceil(px+r));x++)
   if((x-px)*(x-px)+(y-py)*(y-py)<=r*r)G.seen[y*w+x]=true;
}

/* ---- jeu ---- */
function tick(){
 var n=Date.now(),dt=n-G.last;G.last=n;if(dt>1000||dt<0)dt=200;G.t+=dt;
 if(G.limit&&G.t>=G.limit*1000){G.t=G.limit*1000;hud();lose();return}

}
function move(d){

 G.moves++;G.trail.push(G.pos);
 if(!G.go){G.go=true;G.last=Date.now();tm=setInterval(tick,200)}
 reveal();
 if(!G.got[G.pos]&&G.items.indexOf(G.pos)>-1){G.got[G.pos]=1;G.count++;say(G.c.items.e+" Trouvé ! Il en reste "+(G.items.length-G.count)+".");tone("item");buzz(30)}
 if(G.pos===G.exit){
  if(G.count>=G.items.length){hud();draw();win();return true}
  tone("lock");say("🔒 La sortie est verrouillée : il reste "+(G.items.length-G.count)+" "+G.c.items.l+".");

}

 if(G.daily){PR.done[G.i]=d;if(st>(PR.bs[G.i]||0))PR.bs[G.i]=st;if(PR.last!==d){PR.str=(PR.last===d-1)?(PR.str||0)+1:1;PR.last=d}}
 if(G.go&&(!PR.bt[G.i]||G.t<PR.bt[G.i])){PR.bt[G.i]=G.t;rec=" 🏅 Record de temps !"}

 else if(a==="snd"){PR.snd=PR.snd===0?1:0;sv();menu();if(PR.snd!==0)tone("item")}
 else if(a==="menu"){menu();try{root.scrollIntoView({block:"start"})}catch(x){}}
 else if(a==="again")start(G.i,G.daily,G.seed);
 else if(a==="new")start(G.i,false);
});
document.addEventListener("keydown",function(e){
 if(!G||G.state!=="play"||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key,d=-1;
 if(k==="ArrowUp"||k==="z"||k==="w")d=0;else if(k==="ArrowRight"||k==="d")d=1;else if(k==="ArrowDown"||k==="s")d=2;else if(k==="ArrowLeft"||k==="q"||k==="a")d=3;
 if(d<0)return;
 if(k.indexOf("Arrow")===0)e.preventDefault();
 move(d);
});
window.addEventListener("resize",function(){if(G&&G.cv){layout();draw()}});

/* ---- accès rapide (bouton flottant, masqué quand la section est visible) ---- */
try{
 fab=document.createElement("button");fab.className="mz-fab";fab.type="button";fab.textContent="🧩 Mini-jeux";
 fab.addEventListener("click",function(){root.scrollIntoView({behavior:"smooth",block:"start"})});
 document.body.appendChild(fab);
 if("IntersectionObserver" in window){new IntersectionObserver(function(en){fab.style.display=en[0].isIntersecting?"none":""},{threshold:.05}).observe(root)}
}catch(e){}

menu();
})();
</script>

<script>
/* ===== Mini-jeu : mémoire des indices ===== */
(function(){
"use strict";
var root=document.getElementById("memo");if(!root)return;
var EM=["🔍","🗝️","📜","💎","🕯️","🎩","🧤","🕵️","🔦","📓"],LV=[{n:"Facile",p:6,c:3},{n:"Moyen",p:8,c:4},{n:"Difficile",p:10,c:4}],K="mem1",M=null;
function ld(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
var P=ld();function sv(){try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}}
function q(sel){return root.querySelector(sel)}
function menu(){
 M=null;var h='<div class="tape"></div><h2 class="mz-title">🧠 Mini-jeu · Mémoire des indices</h2><p class="hint">Retrouve toutes les paires d’indices en un minimum de coups. Une victoire donne +1 question bonus pour l’enquête du jour (2 par jour au maximum).</p>';
 LV.forEach(function(l,i){h+='<button class="btn" data-mm="'+i+'" type="button">'+l.n+' · '+l.p+' paires'+(P.b&&P.b[i]?' · record '+P.b[i]+' coups':'')+'</button>'});
 root.innerHTML=h;
}
function start(i){
 var l=LV[i],a=EM.slice(0,l.p),d=a.concat(a),k,j,x;
 for(k=d.length-1;k>0;k--){j=Math.floor(Math.random()*(k+1));x=d[k];d[k]=d[j];d[j]=x}
 M={i:i,d:d,open:[],done:{},moves:0,lock:false,left:l.p};
 var h='<div class="tape"></div><button class="btn alt" data-mm="menu" type="button">← Niveaux</button><p class="hint">Coups : <b id="mmc">0</b> · Paires restantes : <b id="mml">'+l.p+'</b></p><div class="mm-grid" style="grid-template-columns:repeat('+l.c+',1fr)">';
 d.forEach(function(e,n){h+='<button class="mm-card" data-k="'+n+'" type="button" aria-label="Carte '+(n+1)+'">?</button>'});
 root.innerHTML=h+'</div><div id="mmres"></div>';
}
function card(n){return q('[data-k="'+n+'"]')}
function flip(n){
 if(!M||M.lock||M.done[n]||M.open.indexOf(n)>=0)return;
 var b=card(n);b.classList.add("up");b.textContent=M.d[n];M.open.push(n);
 if(M.open.length<2)return;
 M.moves++;q("#mmc").textContent=M.moves;
 var a=M.open[0],c=M.open[1];
 if(M.d[a]===M.d[c]){
  M.done[a]=M.done[c]=1;M.open=[];M.left--;q("#mml").textContent=M.left;
  card(a).classList.add("ok");card(c).classList.add("ok");
  if(M.left===0)win();
 }else{
  M.lock=true;
  setTimeout(function(){[a,c].forEach(function(z){var e=card(z);if(e){e.classList.remove("up");e.textContent="?"}});M.open=[];M.lock=false},750);
 }
}
function win(){
 var l=LV[M.i],st=M.moves<=l.p+3?3:M.moves<=l.p*2?2:1,g="";
 P.b=P.b||[];if(!P.b[M.i]||M.moves<P.b[M.i])P.b[M.i]=M.moves;sv();
 try{
  if(window.S&&!S.res){
   if((S.mem||0)<2){S.mem=(S.mem||0)+1;if(window.XADD)XADD(1);g=" +1 question bonus pour l’enquête du jour !"}
   else g=" Limite de 2 bonus par jour atteinte."
  }else g=" L’enquête du jour est déjà terminée."
  if(window.XDONE)XDONE();
 }catch(e){}
 q("#mmres").innerHTML='<div class="card"><span class="stamp w">Bravo !</span><p>'+"⭐⭐⭐".slice(0,st)+'</p><p>Terminé en '+M.moves+' coups.'+g+'</p><button class="btn" data-mm="'+M.i+'" type="button">Rejouer</button><button class="btn alt" data-mm="menu" type="button">Autres niveaux</button></div>';
}
root.addEventListener("click",function(e){
 var k=e.target.closest("[data-k]");if(k){flip(+k.dataset.k);return}
 var b=e.target.closest("[data-mm]");if(!b)return;
 if(b.dataset.mm==="menu")menu();else start(+b.dataset.mm);
});
menu();
})();
</script>


<script>
/* ===== Dossier Expert : contenu téléchargé en ligne (cases-expert.json) ===== */
(function(){
"use strict";
var root=document.getElementById("expert");if(!root)return;
var KS="enq_x",KP="enq_xpack",MAXQ=8,XC=["#c0392b","#2980b9","#27ae60","#8e44ad","#d68910"];
var day=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function ld(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null}}
var pack=ld(KP),XS=ld(KS)||{},pick=-1,note="";
if(XS.day!==day)XS={day:day,asked:[],res:null,streak:XS.streak||0,last:XS.last||0,wins:XS.wins||0,played:XS.played||0};
function sv(){try{localStorage.setItem(KS,JSON.stringify(XS))}catch(e){}}
function valid(c){return c&&c.t&&c.i&&c.th&&c.sc&&c.s&&c.s.length>=3&&c.c>=0&&c.c<c.s.length&&c.s.every(function(s){return s.n&&s.r&&s.a&&s.a.length===4})}
function cs(){return pack&&pack.length?pack[day%pack.length]:null}
function stk(){return XS.last>=day-1?(XS.streak||0):0}
function shareTxt(){var r=XS.res,C=cs();return "🕵️ Dossier Expert n°"+(day%1000)+"\n"+(r.won?"✅ Résolu en "+r.q+" question"+(r.q>1?"s":""):"❌ Classé sans suite")+"\nSerie experte : "+stk()+" jour(s)\nEssaie de faire mieux !"}
function render(){
 var C=cs(),h='<div class="tape"></div><h2 class="mz-title">🕵️ Dossier Expert</h2>';
 if(!C){
  h+='<div class="card"><p>🔒 Les dossiers experts se débloquent <b>en ligne</b>. Connecte-toi une fois pour les télécharger : ils restent ensuite jouables sans connexion.</p><button class="btn" data-x="load" type="button">Réessayer</button><span class="hint"> '+note+'</span></div>';
  root.innerHTML=h;return;
 }
 var n=pack.length,CI=100+(day%n),left=Math.max(0,MAXQ-XS.asked.length);
 SC[CI]=C.sc;
 h+='<p class="hint">Mode expert : '+C.s.length+' suspects, '+MAXQ+' questions seulement, aucun bonus, une seule tentative. Série experte : '+stk()+' jour'+(stk()>1?'s':'')+'.</p>';
 h+='<div class="pic hero">'+scene(CI,C.th)+'</div><h1 style="font-size:24px">'+C.t+'</h1><div class="card intro">'+C.i+'</div>';
 if(XS.res){
  var r=XS.res;
  h+='<div class="card"><span class="stamp '+(r.won?'w':'l')+'">'+(r.won?'Affaire résolue':'Classée sans suite')+'</span><p>'+(r.won?'Bien vu : ':'Le coupable était '+C.s[C.c].n+'. ')+C.x+'</p><pre>'+shareTxt()+'</pre><button class="btn" data-x="share" type="button">Partager le résultat</button><span class="hint">'+note+'</span><p class="hint">Dossiers joués : '+XS.played+' · Résolus : '+XS.wins+'. Nouveau dossier demain à minuit.</p></div>';
 }else{
  var d="";for(var k=0;k<MAXQ;k++)d+='<span class="'+(k<left?"on":"")+'"></span>';
  h+='<div class="count"><span>Questions restantes : '+left+'</span><span class="dots">'+d+'</span></div>';
 }
 C.s.forEach(function(s,si){
  h+='<div class="card" style="border-top:5px solid '+XC[si%XC.length]+'"><div class="who"><span class="pic av">'+face((CI*5)+si,s.n,s.r)+'</span><div><h2>'+s.n+'</h2><div class="role">'+s.r+'</div></div></div>';
  Q.forEach(function(q,qi){
   var asked=XS.asked.some(function(a){return a[0]===si&&a[1]===qi});
   if(asked)h+='<div class="a"><small>'+q+'</small>'+s.a[qi]+'</div>';
   else if(!XS.res)h+='<button class="q" data-xs="'+si+'" data-xq="'+qi+'" type="button"'+(left<1?" disabled":"")+'>'+q+'</button>';
  });
  h+='</div>';
 });
 if(!XS.res){
  h+='<div class="card"><h2>Votre accusation</h2><p class="hint">Une seule tentative.</p>';
  if(pick<0)C.s.forEach(function(s,si){h+='<button class="btn alt" data-xa="'+si+'" type="button">Accuser '+s.n+'</button>'});
  else h+='<p>Accuser <b>'+C.s[pick].n+'</b> ?</p><button class="btn" data-x="ok" type="button">Confirmer</button><button class="btn alt" data-x="no" type="button">Annuler</button>';
  h+='</div>';
 }
 root.innerHTML=h;
}
root.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b||b.disabled)return;
 var C=cs(),y=window.scrollY;
 if(b.dataset.x==="load"){note="Téléchargement…";load();return}
 if(!C)return;
 if(b.dataset.xq!==undefined&&!XS.res&&XS.asked.length<MAXQ){XS.asked.push([+b.dataset.xs,+b.dataset.xq]);sv()}
 else if(b.dataset.xa!==undefined){pick=+b.dataset.xa}
 else if(b.dataset.x==="no"){pick=-1}
 else if(b.dataset.x==="ok"){
  var won=pick===C.c;XS.res={won:won,q:XS.asked.length,pick:pick};XS.played=(XS.played||0)+1;
  if(won){XS.wins=(XS.wins||0)+1;XS.streak=(XS.last===day-1)?(XS.streak||0)+1:1}else XS.streak=0;
  XS.last=day;pick=-1;sv();if(window.XDONE)XDONE();
 }
 else if(b.dataset.x==="share"){
  var t=shareTxt();
  try{if(navigator.share){navigator.share({text:t}).catch(function(){})}else{navigator.clipboard.writeText(t).then(function(){note=" Copié !";render()})}}catch(err){note=" Copiez le texte ci-dessus."}
 }
 render();window.scrollTo(0,y);
});
function load(){
 if(navigator.onLine===false){note="Hors ligne : connecte-toi pour télécharger les dossiers.";render();return}
 fetch("cases-expert.json?d="+day,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(Array.isArray(j)&&j.length&&j.every(valid)){pack=j;note="";try{localStorage.setItem(KP,JSON.stringify(j))}catch(e){}}
  else note="Dossiers indisponibles pour le moment.";
  render();
 }).catch(function(){note="Connexion impossible.";render()});
}
window.addEventListener("online",load);
render();load();
})();
</script>
<script>
/* ===== Récompenses : bonus en ligne, cadeau du jour, badges, invitations ===== */
(function(){
"use strict";
var root=document.getElementById("extras");if(!root)return;
var PFX="en",ID=/^[A-Z0-9]{8,12}$/;
var TG=[[1,"Bronze","circle","#cd7f32"],[5,"Argent","shield","#c0c8d8"],[10,"Or","star","#ffd23f"],[25,"Diamant","diamond","#4fe3ff"],[50,"Couronne","crown","#b57bff"],[100,"Légende","trophy","#ff6b6b"]];
var SH=[[1,"Premier partage","circle","#7ee787"],[5,"Messager","shield","#58d68d"],[10,"Relais","star","#2ecc71"],[25,"Influenceur","diamond","#1abc9c"],[50,"Star","crown","#16a085"]];
function g(k,d){try{var v=localStorage.getItem(PFX+"_"+k);return v===null?d:v}catch(e){return d}}
function st(k,v){try{localStorage.setItem(PFX+"_"+k,String(v))}catch(e){}}
function $(i){return document.getElementById(i)}
function online(){return navigator.onLine!==false}
var pid=g("pid","");
if(!ID.test(pid)){var al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",rr=crypto.getRandomValues(new Uint8Array(10));pid="";rr.forEach(function(x){pid+=al[x%al.length]});st("pid",pid)}
try{var rf=(new URLSearchParams(location.search).get("ref")||"").toUpperCase();if(ID.test(rf)&&rf!==pid&&!g("ref",""))st("ref",rf)}catch(e){}
function link(){return location.origin+"/?ref="+pid}
var shares=+g("shares",0)||0,friends=+g("friends",0)||0,claimed={f:[],s:[]},G={},pend=+g("pend",0)||0;
try{claimed=JSON.parse(g("claimed",'{"f":[],"s":[]}'))||claimed}catch(e){}
try{G=JSON.parse(g("gift","{}"))||{}}catch(e){G={}}
function reached(v,t){return t.filter(function(x){return v>=x[0]}).length}
window.XPERK=function(){return Math.min(3,Math.floor((reached(friends,TG)+reached(shares,SH))/2))};
function msg(t){var m=$("xmsg");if(m)m.textContent=t}
function apply(){if(pend>0&&window.S&&!S.res){S.bonus=(S.bonus||0)+pend;pend=0;st("pend",0);save()}}
window.XADD=function(n){
 if(window.S&&!S.res){S.bonus=(S.bonus||0)+n;save();render();return true}
 pend+=n;st("pend",pend);return false;
};
function svg(sh,c,l,lock){
 c=lock?"#3a4560":c;
 var p={circle:'<circle cx="24" cy="24" r="19" fill="'+c+'"/>',shield:'<path d="M24 4 41 10V24C41 34 33 42 24 45 15 42 7 34 7 24V10Z" fill="'+c+'"/>',star:'<polygon points="24,4 29.5,17.5 44,18.5 33,28 36.5,42.5 24,34.5 11.5,42.5 15,28 4,18.5 18.5,17.5" fill="'+c+'"/>',diamond:'<polygon points="24,3 43,20 24,45 5,20" fill="'+c+'"/>',crown:'<path d="M6 38 9 14 18 24 24 9 30 24 39 14 42 38Z" fill="'+c+'"/>',trophy:'<path d="M14 6H34V20C34 27 29 31 24 31 19 31 14 27 14 20Z M21 31H27V38H21Z M15 38H33V43H15Z" fill="'+c+'"/>'}[sh];
 return '<svg viewBox="0 0 48 48" width="54" height="54">'+p+'<text x="24" y="'+(sh==="crown"?33:26)+'" text-anchor="middle" font-size="13" font-weight="900" fill="'+(lock?"#7b87a6":"#0009")+'">'+l+'</text></svg>';
}
function check(){
 var ch=false;
 TG.forEach(function(t,i){if(friends>=t[0]&&claimed.f.indexOf(i)<0){claimed.f.push(i);ch=true;msg("🏅 Nouveau badge : "+t[1]+" !")}});
 SH.forEach(function(t,i){if(shares>=t[0]&&claimed.s.indexOf(i)<0){claimed.s.push(i);ch=true;msg("🏅 Nouveau badge : "+t[1]+" !")}});
 if(ch){st("claimed",JSON.stringify(claimed));if(window.render)render()}
}
function regShare(){var n=Date.now();if(n-(+g("last",0)||0)<30000)return;st("last",n);shares++;st("shares",shares);check();drawOv()}
function txt(){return "🔎 Viens résoudre l’Enquête du jour ! Sauras-tu trouver le coupable ? "+link()}
function invite(){if(navigator.share){navigator.share({text:txt()}).then(regShare).catch(function(){})}else{window.open("https://wa.me/?text="+encodeURIComponent(txt()),"_blank","noopener");regShare()}}
async function refresh(){
 if(!online())return;
 try{var r=await fetch("/api/me?pid="+pid,{cache:"no-store"});if(!r.ok)return;var j=await r.json();if(typeof j.count==="number"){friends=Math.max(friends,j.count);st("friends",friends);check();drawOv()}}catch(e){}
}
function join(){
 var ref=g("ref","");if(!ref||g("joined","")||!g("played","")||!online())return;
 fetch("/api/join",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pid:pid,ref:ref})}).then(function(r){return r.json()}).then(function(j){if(j&&(j.ok||["already","invalid","limit"].indexOf(j.reason)>=0))st("joined","1")}).catch(function(){});
}
window.XDONE=function(){st("played","1");join();refresh()};
async function sd(){var r=await fetch(location.pathname,{method:"HEAD",cache:"no-store"}),d=r.headers.get("date");if(!d)throw 0;return new Date(d).toISOString().slice(0,10)}
function bf(d){var t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()-1);return t.toISOString().slice(0,10)}
async function gift(claim){
 var b=$("xgift");if(!b)return;b.style.boxShadow="";
 if(!online()){b.textContent="🎁 Cadeau (connexion requise)";if(claim)msg("Connecte-toi à internet pour réclamer ton cadeau.");return}
 try{
  var d=await sd();
  if(G.day===d){b.textContent="🎁 Reviens demain";if(claim)msg("Déjà réclamé aujourd’hui. Série : "+(G.streak||1)+" jour(s).");return}
  var n=G.day===bf(d)?(G.streak||0)+1:1,a=n>=3?2:1;
  if(!claim){b.textContent="🎁 Cadeau prêt : +"+a+" question"+(a>1?"s":"");b.style.boxShadow="0 0 14px #e8c547";return}
  G={day:d,streak:n};st("gift",JSON.stringify(G));
  var now=XADD(a);b.textContent="🎁 Reviens demain";
  msg("🎁 +"+a+" question"+(a>1?"s":"")+(now?"":" (gardé pour la prochaine enquête)")+" · série de "+n+" jour(s) !");
 }catch(e){b.textContent="🎁 Cadeau (connexion requise)";if(claim)msg("Impossible de vérifier la date. Réessaie en ligne.")}
}
function net(){var e=$("xnet");if(e)e.textContent=online()?"🌐 En ligne : +1 question bonus aujourd’hui.":"📴 Hors ligne : pas de bonus en ligne."}
var ov=null;
function drawOv(){
 if(!ov)return;
 function grid(t,v,u){return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+t.map(function(x){var ok=v>=x[0];return '<div style="text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:8px;opacity:'+(ok?1:.55)+'">'+svg(x[2],x[3],x[0],!ok)+'<div style="font-size:11px;font-weight:700">'+x[1]+'</div><div style="font-size:10px;color:var(--mute)">'+(ok?"✔":x[0]+" "+u)+'</div></div>'}).join("")+"</div>"}
 ov.querySelector(".bd").innerHTML='<p>👥 Amis invités : <b>'+friends+'</b><br>📤 Partages : <b>'+shares+'</b><br>🎯 Bonus permanent : <b>+'+XPERK()+'</b> question'+(XPERK()>1?"s":"")+' (1 de plus tous les 2 badges, 3 au maximum)</p><p class="hint" style="word-break:break-all">'+link()+'</p><button class="btn" id="xo1" type="button">📤 Inviter</button><button class="btn alt" id="xo2" type="button">Copier le lien</button><h3>👥 Ambassadeur</h3>'+grid(TG,friends,"amis")+'<h3>📤 Partageur</h3>'+grid(SH,shares,"partages")+'<p class="hint">Un ami compte quand il termine sa première partie avec ton lien. Pour voir tes amis, il faut être connecté à internet.</p>';
 ov.querySelector("#xo1").onclick=invite;
 ov.querySelector("#xo2").onclick=function(){var t=link();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg("Lien copié !")}).catch(function(){window.prompt("Copie ton lien :",t)});else window.prompt("Copie ton lien :",t);regShare()};
}
function open(){
 if(ov)return;
 var o=document.createElement("div");
 o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px";
 o.innerHTML='<div style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🏅 Badges et amis</h2><button class="btn alt" id="xclose" type="button">✕</button></div><div class="bd"></div></div>';
 document.body.appendChild(o);ov=o;
 function close(){o.remove();ov=null}
 o.addEventListener("click",function(e){if(e.target===o)close()});o.querySelector("#xclose").onclick=close;
 drawOv();refresh();
}
root.innerHTML='<div class="tape"></div><h2 class="mz-title">🏅 Récompenses</h2><p class="hint" id="xnet"></p><button class="btn" id="xgift" type="button">🎁 Cadeau du jour</button><button class="btn alt" id="xbadges" type="button">🏅 Badges et amis</button><button class="btn alt" id="xinv" type="button">📤 Inviter un ami</button><p class="hint" id="xmsg"></p><details class="hint"><summary>Confidentialité</summary><p>L’Enquête du jour ne demande ni compte, ni nom, ni e-mail. Ta progression est enregistrée uniquement sur ton appareil. Si tu invites des amis, un identifiant anonyme est enregistré sur notre serveur pour compter les invitations. Le jeu peut afficher des publicités de la régie Monetag, qui peut utiliser des cookies ou des identifiants publicitaires.</p></details>';
$("xgift").onclick=function(){gift(true)};$("xbadges").onclick=open;$("xinv").onclick=invite;
window.addEventListener("online",function(){net();gift(false);join();refresh();if(window.render)render()});
window.addEventListener("offline",function(){net();gift(false);if(window.render)render()});
apply();net();gift(false);check();join();refresh();
})();
</script>
